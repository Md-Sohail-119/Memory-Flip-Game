<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <div class="difficulty">
                <span>Difficulty Level</span>
                <button type="reset">Easy</button>
                <button type="reset">Medium</button>
                <button type="reset">Hard</button>
            </div>
            <div class="heading">
                <h1>Memory Card Game</h1>
            </div>
        </div>
    </nav>
    <p>Time: <span>00: 00</span></p>
    <div class="game-container">
        <div class="grid-container">
            <!-- <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div> -->
            <p>Move: <span></span></p>
        </div>
        <div class="score-board">
            <div class="score-card">
                <div class="current">
                    <p>Your Score: <span></span></p>
                    <p>Your Time: <span></span></p>
                </div>
                <div class="best">
                    <p>Best Score: <span></span></p>
                    <p>Best Time: <span></span></p>
                </div>
            </div>
        </div>
    </div>
    <button type="reset">Restart</button>
    <button type="reset">Reset</button>
    <script src="script.js"></script>
</body>

</html>
