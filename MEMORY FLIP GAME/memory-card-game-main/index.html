<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Memory Card Game</title>
  <link rel="stylesheet" type="text/css" href="style.orig.css">
  </head>
  <body>
    <h1>Memory Cards</h1>
    <div class="game-container">
      <div class="difficulty-panel">
        <h2>Difficulty</h2>
        <div class="difficulty-buttons">
          <button onclick="setDifficulty('easy')" class="difficulty-btn easy-btn">Easy</button>
          <button onclick="setDifficulty('medium')" class="difficulty-btn medium-btn">Medium</button>
          <button onclick="setDifficulty('hard')" class="difficulty-btn hard-btn">Hard</button>
        </div>
      </div>
      <div class="grid-container">
      </div>
      <div class="score-card">
        <h2>Score Card</h2>
        <div class="current-stats">
          <h3>Current Game</h3>
          <div class="timer">Time: <span id="stopwatch">00:00</span></div>
          <div class="moves">Moves: <span class="score"></span></div>
        </div>
        <div class="best-stats">
          <h3>Best Score</h3>
          <div class="best-time">Best Time: <span id="best-time">--:--</span></div>
          <div class="best-moves">Best Moves: <span id="best-score">--</span></div>
        </div>
        <div class="actions">
          <button onclick="restart()">Restart</button>
          <button onclick="resetAll()" class="reset-btn">Reset</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
